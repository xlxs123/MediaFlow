name: Windows build and update regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signpath_request:
        description: 'Request Foundation signing only after approved policy and protected Environment setup'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keep signing waits isolated from ordinary CI. Default pending capacity is
  # still one: a third signing dispatch may replace the pending (not active) run.
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.signpath_request && github.ref == 'refs/heads/main' && github.repository == 'xlxs123/MediaFlow') && 'mediaflow-signpath-main' || format('mediaflow-ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.signpath_request && github.ref == 'refs/heads/main' && github.repository == 'xlxs123/MediaFlow') }}

jobs:
  windows:
    name: Python 3.14 / Windows x64
    outputs:
      build_version: ${{ steps.source-identity.outputs.version }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; official tag verified
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Python 3.14 x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; official tag verified
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-security.txt

      - name: Install pinned dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the isolated build environment.' }
          & .\.venv\Scripts\python.exe -B -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned secure build bootstrap installation failed.' }
          & .\.venv\Scripts\python.exe -B -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency installation failed.' }

      - name: Prepare independently pinned scanner for regression
        run: |
          & .\.venv\Scripts\python.exe -B scripts/security_tools.py --tool gitleaks --directory (Join-Path $env:RUNNER_TEMP 'mediaflow-gitleaks')
          if ($LASTEXITCODE -ne 0) { throw 'Pinned secret scanner could not be verified.' }
          ('MEDIAFLOW_GITLEAKS=' + (Join-Path $env:RUNNER_TEMP 'mediaflow-gitleaks/gitleaks.exe')) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Basic source and structure-checker tests
        id: source-identity
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import ast
          from pathlib import Path
          from core.update_manifest import parse_version
          from utils.branding import APP_VERSION
          files = [Path('main.py')]
          files += [path for directory in ('core', 'ui', 'utils', 'scripts', 'tests')
                    for path in Path(directory).rglob('*.py')]
          for path in files:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=path.as_posix())
          version = parse_version(APP_VERSION)
          if version.is_prerelease or version.local:
              raise SystemExit('CI build version must be an ordinary release version.')
          print(f'Syntax checked: {len(files)} Python source files; version {APP_VERSION}')
          '@ | & .\.venv\Scripts\python.exe -X utf8 -B -
          if ($LASTEXITCODE -ne 0) { throw 'Basic source validation failed.' }
          & .\.venv\Scripts\python.exe -X utf8 -B -m unittest tests.test_release_structure -v
          if ($LASTEXITCODE -ne 0) { throw 'Release-structure regression failed.' }
          $version = (& .\.venv\Scripts\python.exe -X utf8 -B -c 'from utils.branding import APP_VERSION; print(APP_VERSION)').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine the build version.' }
          "MEDIAFLOW_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Inspect disabled or reviewed SignPath configuration without credentials
        run: |
          & .\.venv\Scripts\python.exe -B scripts/signpath_integration.py status
          if ($LASTEXITCODE -ne 0) { throw 'Invalid reviewed SignPath policy.' }

      - name: Prepare verified portable tools
        run: |
          & .\.venv\Scripts\python.exe -X utf8 -B tools\prepare_tools.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable tools failed download or publisher checksum verification.' }

      - name: Prepare isolated regression dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $testEnvironment = Join-Path $env:RUNNER_TEMP 'mediaflow-regression-venv'
          python -m venv $testEnvironment
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the separate regression environment.' }
          $testPython = Join-Path $testEnvironment 'Scripts/python.exe'
          & $testPython -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned regression bootstrap failed.' }
          & $testPython -m pip install -r requirements.txt -r requirements-security.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned application and schema-test dependencies failed.' }
          ('MEDIAFLOW_TEST_PYTHON=' + $testPython) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Update, signature, deployment and rollback regression
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:MEDIAFLOW_TEST_PYTHON -X utf8 -B tests\run_update_tests.py --report-dir verification/ci/update
          if ($LASTEXITCODE -ne 0) {
            foreach ($name in @('core', 'ui', 'output')) {
              $log = Join-Path 'verification/ci/update' ($name + '.txt')
              if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 80 }
            }
            throw 'Focused update regression failed.'
          }
          $result = Get-Content -LiteralPath verification/ci/update/results.json -Raw | ConvertFrom-Json
          if (-not $result.passed -or -not $result.source_unchanged -or
              $result.tests -le 0 -or $result.failures -ne 0 -or $result.errors -ne 0 -or
              @($result.groups | Where-Object { @($_.unexpected_skips).Count -gt 0 }).Count -gt 0) {
            throw 'Focused regression failed or skipped an unexpected capability.'
          }

      - name: Build an independent Windows folder
        run: |
          $ErrorActionPreference = 'Stop'
          # Tests ran above. The normal build still checks its actual EXE identity.
          & .\build.ps1 -Python (Get-Command python).Source -OutputDirectory dist-mediaflow-ci `
              -SkipDependencyInstall -SkipToolDownload -SkipTests
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed.' }

      - name: Start the packaged EXE and check complete release structure
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'dist-mediaflow-ci'
          $privateIdentity = Join-Path $env:RUNNER_TEMP 'mediaflow-ci-runtime-identity.json'
          $process = Start-Process -FilePath (Join-Path $release 'MediaFlow.exe') `
              -ArgumentList @('--build-info', ('"' + $privateIdentity + '"')) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(120000)) {
            $process.Kill($true)
            throw 'The newly built EXE did not complete its identity check within 120 seconds.'
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $privateIdentity)) {
            throw 'The newly built EXE failed its actual runtime identity check.'
          }
          & .\.venv\Scripts\python.exe -X utf8 -B scripts\check_release_structure.py `
              --release-dir $release --expected-version $env:MEDIAFLOW_BUILD_VERSION `
              --runtime-identity $privateIdentity --report verification/ci/release-structure.json
          if ($LASTEXITCODE -ne 0) { throw 'Complete portable-release structure check failed.' }

      - name: Inspect unsigned application and preserved third-party signatures
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $PSHOME 'pwsh.exe') -NoLogo -NoProfile -NonInteractive -File scripts/authenticode.ps1 `
            -Operation Inspect -Mode CI -ReleaseDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist-mediaflow-ci') `
            -Report (Join-Path $env:GITHUB_WORKSPACE 'verification/ci/authenticode-inventory.json')
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned/third-party Authenticode inspection failed.' }
          $result = Get-Content -LiteralPath verification/ci/authenticode-inventory.json -Raw | ConvertFrom-Json
          if (-not $result.passed -or $result.formal_verified -or $result.mode -ne 'CI') {
            throw 'Ordinary CI must inspect bytes without claiming formal publisher signing.'
          }

      - name: Exercise isolated test-certificate signing and rejection paths
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10).KitsRoot10
          $sdk = Get-ChildItem -LiteralPath (Join-Path $sdkRoot 'bin') -Recurse -File -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object { [version]$_.VersionInfo.ProductVersion } | Select-Object -Last 1
          if (-not $sdk) { throw 'Official Windows SDK x64 SignTool is required for isolated integration.' }
          $workRoot = Join-Path $env:RUNNER_TEMP 'MediaFlow-authenticode-tests'
          New-Item -ItemType Directory -Path $workRoot -Force | Out-Null
          $work = Join-Path $workRoot ($env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          & (Join-Path $PSHOME 'pwsh.exe') -NoLogo -NoProfile -NonInteractive -File tests/authenticode_local_integration.ps1 `
            -WorkRoot $workRoot -WorkDirectory $work -SourceDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist-mediaflow-ci') `
            -SignToolPath $sdk.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Actual test-certificate integration failed; no production certificate was requested.' }
          $resultPath = Join-Path $work 'integration-results.json'
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if (-not $result.passed -or $result.formal_signed -or -not $result.trust_roots_unchanged) {
            throw 'Test-certificate integration must remain separate from Windows trust and formal signing.'
          }
          Copy-Item -LiteralPath $resultPath -Destination verification/ci/authenticode-tests.json -ErrorAction Stop

      - name: Bind passed CI checks to the complete build
        run: |
          $ErrorActionPreference = 'Stop'
          # This unsigned receipt binds bytes and reports. The local release
          # orchestrator separately verifies the GitHub run and artifact digest.
          $commit = (& git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -ne $env:GITHUB_SHA) {
            throw 'The actual checkout commit does not match this GitHub run.'
          }
          & .\.venv\Scripts\python.exe -X utf8 -B scripts\ci_build_receipt.py create `
              --release-dir dist-mediaflow-ci --expected-version $env:MEDIAFLOW_BUILD_VERSION `
              --runtime-identity (Join-Path $env:RUNNER_TEMP 'mediaflow-ci-runtime-identity.json') `
              --test-results verification/ci/update/results.json `
              --structure-report verification/ci/release-structure.json `
              --repository $env:GITHUB_REPOSITORY --commit $commit --run-id $env:GITHUB_RUN_ID `
              --output verification/ci/build-attestation.json
          if ($LASTEXITCODE -ne 0) { throw 'CI build receipt validation failed; no passed build will be retained.' }

      - name: Generate and independently validate actual-package SBOM
        run: |
          $ErrorActionPreference = 'Stop'
          & .\.venv\Scripts\python.exe -B scripts/generate_sbom.py --release-dir dist-mediaflow-ci `
            --build-dir build/MediaFlow --receipt verification/ci/build-attestation.json --output verification/ci/sbom
          if ($LASTEXITCODE -ne 0) { throw 'Actual package inventory failed; no passed SBOM is claimed.' }
          python -m venv .security-venv
          if ($LASTEXITCODE -ne 0) { throw 'Independent schema-validator environment failed.' }
          & .\.security-venv\Scripts\python.exe -m pip install -r requirements-build.txt -r requirements-security.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned schema validator installation failed.' }
          & .\.security-venv\Scripts\python.exe -B scripts/validate_sbom.py --directory verification/ci/sbom --require-native
          if ($LASTEXITCODE -ne 0) { throw 'Official CycloneDX schema or inventory binding failed.' }

      - name: Retain verified SBOM and generation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; official tag verified
        with:
          name: MediaFlow-${{ env.MEDIAFLOW_BUILD_VERSION }}-sbom-${{ github.run_id }}
          path: verification/ci/sbom/
          if-no-files-found: error
          retention-days: 30

      - name: Retain passed build and public summaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MediaFlow-${{ env.MEDIAFLOW_BUILD_VERSION }}-windows-x64-ci-${{ github.run_id }}
          path: |
            dist-mediaflow-ci/
            verification/ci/release-structure.json
            verification/ci/update/results.json
            verification/ci/build-attestation.json
            verification/ci/authenticode-inventory.json
            verification/ci/authenticode-tests.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain failed-test summary
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MediaFlow-windows-ci-failure-${{ github.run_id }}
          path: verification/ci/update/results.json
          if-no-files-found: ignore
          retention-days: 7

  provenance:
    name: Official build provenance
    needs: windows
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      # This privileged job executes no project commands and checks out no source.
      # Only immutable artifacts from its successful build dependency are used.
      - name: Download the validated Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2; official tag verified
        with:
          name: MediaFlow-${{ needs.windows.outputs.build_version }}-windows-x64-ci-${{ github.run_id }}
          path: verified-build
      - name: Download independently validated SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MediaFlow-${{ needs.windows.outputs.build_version }}-sbom-${{ github.run_id }}
          path: verified-sbom
      - name: Attest actual EXE, byte-bound receipt and check reports
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2; official tag verified
        with:
          subject-path: |
            verified-build/dist-mediaflow-ci/MediaFlow.exe
            verified-build/verification/ci/build-attestation.json
            verified-build/verification/ci/update/results.json
            verified-build/verification/ci/release-structure.json
            verified-sbom/mediaflow.cdx.json
            verified-sbom/inventory.json
            verified-sbom/generation.json
            verified-sbom/validation.json
            verified-build/verification/ci/authenticode-inventory.json
            verified-build/verification/ci/authenticode-tests.json
      - name: Retain official Sigstore verification bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MediaFlow-${{ needs.windows.outputs.build_version }}-provenance-${{ github.run_id }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30

  signpath:
    name: Opt-in Foundation signing (not publication)
    needs: [windows, provenance]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signpath_request && github.ref == 'refs/heads/main' && github.repository == 'xlxs123/MediaFlow' }}
    runs-on: windows-2022
    timeout-minutes: 60
    environment: signpath-foundation
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      SIGNPATH_TOKEN_PRESENT: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - name: Checkout the exact approved default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verification Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Fail closed before dependency/download/request work
        id: preflight
        run: |
          python -B scripts/signpath_integration.py preflight
          if ($LASTEXITCODE -ne 0) { throw 'Foundation approval, reviewed identity and protected token are required.' }
      - name: Install isolated verification dependencies
        run: |
          python -m venv .signpath-venv
          if ($LASTEXITCODE -ne 0) { throw 'Verification environment failed.' }
          & .\.signpath-venv\Scripts\python.exe -m pip install -r requirements-build.txt -r requirements.txt -r requirements-security.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned verification dependencies failed.' }
      - name: Download this run's passed complete Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MediaFlow-${{ needs.windows.outputs.build_version }}-windows-x64-ci-${{ github.run_id }}
          path: signpath-build
      - name: Download this run's validated original SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MediaFlow-${{ needs.windows.outputs.build_version }}-sbom-${{ github.run_id }}
          path: signpath-sbom
      - name: Verify receipt, latest exact-commit security and official source proofs
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & .\.signpath-venv\Scripts\python.exe -B scripts/signpath_integration.py prepare `
            --bundle signpath-build --sbom signpath-sbom --work signpath-source-check --output signpath-unsigned
          if ($LASTEXITCODE -ne 0) { throw 'Unverified source bytes cannot be submitted for signing.' }
      - name: Upload only the three first-party PEs for trusted-build origin checking
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MediaFlow-first-party-unsigned
          path: signpath-unsigned/
          if-no-files-found: error
          retention-days: 7
      - name: Submit to the reviewed Foundation policy and wait for manual approval
        id: submit
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # official v3.0 verified
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ steps.prepare.outputs.organization_id }}
          project-slug: ${{ steps.prepare.outputs.project_slug }}
          signing-policy-slug: ${{ steps.prepare.outputs.signing_policy_slug }}
          artifact-configuration-slug: ${{ steps.prepare.outputs.artifact_configuration_slug }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          service-unavailable-timeout-in-seconds: 120
          download-signed-artifact-timeout-in-seconds: 180
          output-artifact-directory: signpath-returned
          skip-decompress: true
          parameters: |
            version: ${{ toJSON(needs.windows.outputs.build_version) }}
      - name: Independently verify returned paths, payload, signer, trust and RFC3161 timestamp
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archives = @(Get-ChildItem -LiteralPath signpath-returned -File)
          if ($archives.Count -ne 1 -or $archives[0].Extension -ne '.zip') { throw 'Expected one raw signing ZIP.' }
          & .\.signpath-venv\Scripts\python.exe -B scripts/signpath_integration.py complete `
            --bundle signpath-build --sbom signpath-sbom --work signpath-return-check `
            --output signpath-signed-release --signed-archive $archives[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Returned signing result failed independent verification.' }
      - name: Retain verified signed tree and separate derivation (not a stable release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MediaFlow-signpath-verified-${{ github.run_id }}
          path: |
            signpath-signed-release/
            signpath-return-check/authenticode-signed.json
            signpath-return-check/signing-derivation.json
            signpath-return-check/signpath-result.json
          if-no-files-found: error
          retention-days: 14
